name: Build desktop downloads

# Build directly into a draft release. Publish after reviewing every platform and the account audit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag matching package.json (for example v0.4.0)
        required: true

permissions:
  contents: read

jobs:
  prepare:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare draft download release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$REQUESTED_TAG" = "v$version"
          if gh release view "$REQUESTED_TAG" --json isDraft > release-state.json 2>/dev/null; then
            test "$(node -p "require('./release-state.json').isDraft")" = true
          else
            gh release create "$REQUESTED_TAG" --target "$GITHUB_SHA" --title "PANDR-5 $REQUESTED_TAG preview" --draft --prerelease --notes-file RELEASE_NOTES.md
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
  desktop:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            targets: --mac --arm64 --x64
          - os: windows-latest
            platform: windows
            targets: --win --x64
          - os: ubuntu-latest
            platform: linux
            targets: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Find app folder
        id: location
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "app=." >> "$GITHUB_OUTPUT"
          elif [ -f App/package.json ]; then
            echo "app=App" >> "$GITHUB_OUTPUT"
          else
            echo "PANDR-5 package.json was not found."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.location.outputs.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.location.outputs.app }}
      - run: npm run check
        working-directory: ${{ steps.location.outputs.app }}
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ENABLE_CLOUD_SYNC: 'true'
      - name: Package unsigned desktop apps
        shell: bash
        run: npx electron-builder --config electron-builder.yml --publish never ${{ matrix.targets }}
        working-directory: ${{ steps.location.outputs.app }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach downloads directly to the draft release
        shell: bash
        working-directory: ${{ steps.location.outputs.app }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.exe release/*.AppImage)
          test ${#files[@]} -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"
