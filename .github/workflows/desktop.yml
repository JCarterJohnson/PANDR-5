name: Build desktop downloads

# Tags and manual invocations build downloads. Nothing is auto-published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            targets: --mac --arm64 --x64
          - os: windows-latest
            platform: windows
            targets: --win --x64
          - os: ubuntu-latest
            platform: linux
            targets: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Find app folder
        id: location
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "app=." >> "$GITHUB_OUTPUT"
          elif [ -f App/package.json ]; then
            echo "app=App" >> "$GITHUB_OUTPUT"
          else
            echo "PANDR-5 package.json was not found."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.location.outputs.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.location.outputs.app }}
      - run: npm run check
        working-directory: ${{ steps.location.outputs.app }}
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ENABLE_CLOUD_SYNC: 'true'
      - name: Package unsigned desktop apps
        shell: bash
        run: npx electron-builder --config electron-builder.yml --publish never ${{ matrix.targets }}
        working-directory: ${{ steps.location.outputs.app }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pandr-5-${{ matrix.platform }}
          path: |
            ${{ steps.location.outputs.app }}/release/*.dmg
            ${{ steps.location.outputs.app }}/release/*.zip
            ${{ steps.location.outputs.app }}/release/*.exe
            ${{ steps.location.outputs.app }}/release/*.AppImage
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Publish preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "PANDR-5 $RELEASE_TAG preview" --prerelease --notes-file RELEASE_NOTES.md
          gh release upload "$RELEASE_TAG" artifacts/**/* --repo "$GITHUB_REPOSITORY"
