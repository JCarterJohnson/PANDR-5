name: Check app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Find app folder
        id: location
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "app=." >> "$GITHUB_OUTPUT"
          elif [ -f App/package.json ]; then
            echo "app=App" >> "$GITHUB_OUTPUT"
          else
            echo "PANDR-5 package.json was not found."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.location.outputs.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ steps.location.outputs.app }}
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run check
        working-directory: ${{ steps.location.outputs.app }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: ${{ steps.location.outputs.app }}/dist
          retention-days: 7
          if-no-files-found: error
